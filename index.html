<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素时钟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-monospaced-sc@5.3.0/index.min.css" rel="stylesheet">
<style>
  :root {
    --bg:      #1a1c2c;
    --panel:   #333c57;
    --border:  #566c86;
    --light:   #94b0c2;
    --text:    #f4f4f4;
    --green:   #38b764;
    --lgreen:  #a7f070;
    --red:     #b13e53;
    --orange:  #ef7d57;
    --skin:    #ffcd75;
    --pix-en:  'Press Start 2P', monospace;
    --pix-zh:  'Fusion Pixel 12px Monospaced SC', 'Press Start 2P', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; image-rendering: pixelated; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--border) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    color: var(--text);
    font-family: var(--pix-zh);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }

  /* ===== CRT 扫描线 + 暗角 ===== */
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px);
    mix-blend-mode: multiply;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 49;
    box-shadow: inset 0 0 140px 40px rgba(0,0,0,.55);
  }

  /* ===== 通用像素按钮 ===== */
  .px-btn {
    font-family: var(--pix-zh);
    font-size: 14px;
    color: var(--text);
    background: var(--panel);
    border: 0;
    padding: 12px 20px;
    cursor: pointer;
    box-shadow:
      inset -4px -4px 0 rgba(0,0,0,.4),
      inset  4px  4px 0 rgba(255,255,255,.18),
      0 6px 0 rgba(0,0,0,.45);
    transition: none;
  }
  .px-btn:hover { filter: brightness(1.15); }
  .px-btn:active {
    transform: translateY(4px);
    box-shadow:
      inset -4px -4px 0 rgba(0,0,0,.4),
      inset  4px  4px 0 rgba(255,255,255,.18),
      0 2px 0 rgba(0,0,0,.45);
  }
  .px-btn.primary {
    background: var(--green);
    color: #10131f;
  }
  .px-btn.accent { background: var(--red); }

  /* ===== 模式切换栏 ===== */
  #mode-bar {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
    transition: opacity .3s;
  }
  #mode-bar .px-btn { font-size: 14px; }
  #mode-bar .px-btn.active {
    background: var(--lgreen);
    color: #10131f;
    box-shadow:
      inset -4px -4px 0 rgba(0,0,0,.25),
      inset  4px  4px 0 rgba(255,255,255,.35),
      0 6px 0 rgba(0,0,0,.45);
  }
  body.in-fullscreen #mode-bar { opacity: 0; pointer-events: none; }
  body.in-fullscreen:hover #mode-bar { opacity: 1; pointer-events: auto; }

  /* ===== 像素小人 ===== */
  #mascot { display: flex; flex-direction: column; align-items: center; margin-bottom: 2vh; }
  .char { width: clamp(72px, 10vw, 120px); animation: hop 1.6s steps(1) infinite; }
  @keyframes hop { 0%, 49.9% { transform: translateY(0); } 50%, 99.9% { transform: translateY(-8px); } 100% { transform: translateY(0); } }
  .fA { animation: fa .7s steps(1) infinite; }
  .fB { animation: fb .7s steps(1) infinite; }
  @keyframes fa { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes fb { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
  .eyes { animation: blink 4.2s steps(1) infinite; }
  @keyframes blink { 0%, 90% { opacity: 1; } 91%, 95% { opacity: 0; } 96%, 100% { opacity: 1; } }
  .ground {
    width: clamp(96px, 13vw, 156px); height: 10px; margin-top: -2px;
    background:
      linear-gradient(var(--green) 0 4px, var(--lgreen) 4px 6px, var(--green) 6px 10px);
    box-shadow: 0 6px 0 rgba(0,0,0,.4);
  }

  /* ===== 主显示 ===== */
  #display {
    font-family: var(--pix-en);
    font-variant-numeric: tabular-nums;
    font-size: clamp(36px, 11vw, 150px);
    line-height: 1.15;
    color: var(--lgreen);
    text-shadow:
      4px 4px 0 var(--green),
      8px 8px 0 rgba(0,0,0,.4);
    text-align: center;
    letter-spacing: .02em;
  }
  #display.danger { color: var(--orange); text-shadow: 4px 4px 0 var(--red), 8px 8px 0 rgba(0,0,0,.4); }
  .blink { animation: cblink 1s steps(1) infinite; }
  @keyframes cblink { 50% { opacity: 0; } }
  .millis { font-size: .45em; color: var(--light); text-shadow: 2px 2px 0 rgba(0,0,0,.4); }
  #sub-display {
    margin-top: 22px;
    font-size: clamp(14px, 2.4vw, 24px);
    color: var(--light);
    text-align: center;
    letter-spacing: .2em;
    text-shadow: 2px 2px 0 rgba(0,0,0,.4);
  }

  /* ===== 控制区 ===== */
  #controls {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    transition: opacity .3s;
  }
  body.in-fullscreen #controls { opacity: 0; pointer-events: none; }
  body.in-fullscreen:hover #controls { opacity: 1; pointer-events: auto; }

  /* ===== 定时输入 ===== */
  #timer-input input {
    font-family: var(--pix-en);
    font-size: clamp(28px, 7vw, 90px);
    width: 2.6em;
    text-align: center;
    color: var(--lgreen);
    background: var(--bg);
    border: 4px solid var(--border);
    outline: none;
    padding: 8px 4px;
    -moz-appearance: textfield;
    appearance: textfield;
    text-shadow: 3px 3px 0 rgba(0,0,0,.4);
  }
  #timer-input input:focus { border-color: var(--lgreen); }
  #timer-input input::-webkit-outer-spin-button,
  #timer-input input::-webkit-inner-spin-button { -webkit-appearance: none; }
  #timer-input .colon {
    font-family: var(--pix-en);
    font-size: clamp(28px, 7vw, 90px);
    color: var(--light);
    margin: 0 10px;
    text-shadow: 3px 3px 0 rgba(0,0,0,.4);
  }
  .hidden { display: none !important; }

  /* 全屏提示 */
  #fs-tip {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--pix-zh);
    font-size: 13px;
    color: var(--border);
    letter-spacing: .15em;
    transition: opacity 1s;
    animation: cblink 2s steps(1) infinite;
  }
</style>
</head>

h="1" height="1" fill="#38b764"/><rect x="10" y="8" width="1" height="1" fill="#38b764"/><rect x="2" y="9" width="1" height="1" fill="#38b764"/><rect x="3" y="9" width="1" height="1" fill="#38b764"/><rect x="4" y="9" width="1" height="1" fill="#38b764"/><rect x="5" y="9" width="1" height="1" fill="#38b764"/><rect x="6" y="9" width="1" height="1" fill="#38b764"/><rect x="7" y="9" width="1" height="1" fill="#38b764"/><rect x="8" y="9" width="1" height="1" fill="#38b764"/><rect x="9" y="9" width="1" height="1" fill="#38b764"/><rect x="2" y="10" width="1" height="1" fill="#38b764"/><rect x="3" y="10" width="1" height="1" fill="#38b764"/><rect x="4" y="10" width="1" height="1" fill="#38b764"/><rect x="5" y="10" width="1" height="1" fill="#38b764"/><rect x="6" y="10" width="1" height="1" fill="#38b764"/><rect x="7" y="10" width="1" height="1" fill="#38b764"/><rect x="8" y="10" width="1" height="1" fill="#38b764"/><rect x="9" y="10" width="1" height="1" fill="#38b764"/><rect x="2" y="11" width="1" height="1" fill="#333c57"/><rect x="3" y="11" width="1" height="1" fill="#333c57"/><rect x="4" y="11" width="1" height="1" fill="#333c57"/><rect x="5" y="11" width="1" height="1" fill="#333c57"/><rect x="6" y="11" width="1" height="1" fill="#333c57"/><rect x="7" y="11" width="1" height="1" fill="#333c57"/><rect x="8" y="11" width="1" height="1" fill="#333c57"/><rect x="9" y="11" width="1" height="1" fill="#333c57"/><rect x="2" y="12" width="1" height="1" fill="#333c57"/><rect x="3" y="12" width="1" height="1" fill="#333c57"/><rect x="8" y="12" width="1" height="1" fill="#333c57"/><rect x="9" y="12" width="1" height="1" fill="#333c57"/><rect x="2" y="13" width="1" height="1" fill="#333c57"/><rect x="3" y="13" width="1" height="1" fill="#333c57"/><rect x="8" y="13" width="1" height="1" fill="#333c57"/><rect x="9" y="13" width="1" height="1" fill="#333c57"/><rect x="2" y="14" width="1" height="1" fill="#1a1c2c"/><rect x="3" y="14" width="1" height="1" fill="#1a1c2c"/><rect x="8" y="     <div class="ground"></div>
  </div>

  <!-- 主显示 -->
  <div id="display">00:00:00</div>
  <div id="sub-display"></div>

  <!-- 定时模式输入 -->
  <div id="timer-input" class="hidden">
    <input type="number" id="t-min" min="0" max="99" value="5">
    <span class="colon">:</span>
    <input type="number" id="t-sec" min="0" max="59" value="00">
  </div>

  <!-- 控制按钮 -->
  <div id="controls"></div>

  <div id="fs-tip">双击屏幕 切换全屏</div>

<script>
(function () {
  const $display     = document.getElementById('display');
  const $sub         = document.getElementById('sub-display');
  const $controls    = document.getElementById('controls');
  const $timerInput  = document.getElementById('timer-input');
  const $tMin        = document.getElementById('t-min');
  const $tSec        = document.getElementById('t-sec');
  const $fsTip       = document.getElementById('fs-tip');
  const modeBtns     = document.querySelectorAll('#mode-bar button');

  let mode = 'clock';
  const pad2 = n => String(n).padStart(2, '0');
  const colon = '<span class="blink">:</span>';

  /* ---------------- 时钟模式 ---------------- */
  function renderClock() {
    const now = new Date();
    $display.innerHTML = pad2(now.getHours()) + colon + pad2(now.getMinutes()) + colon + pad2(now.getSeconds());
    const week = ['日','一','二','三','四','五','六'][now.getDay()];
    $sub.textContent = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate()) + ' 星期' + week;
  }

  /* ---------------- 计时（秒表）模式 ---------------- */
  const sw = { elapsed: 0, startAt: 0, running: false };

  function swRender() {
    const ms = sw.running ? Date.now() - sw.startAt : 0;
    const total = sw.elapsed + ms;
    const m = Math.floor(total / 60000);
    const s = Math.floor(total / 1000) % 60;
    const tenth = Math.floor(total / 100) % 10;
    $display.innerHTML = pad2(m) + '<span class="blink">:</span>' + pad2(s) + '<span class="millis">.' + tenth + '</span>';
  }
  function swStartPause() {
    if (sw.running) { sw.elapsed += Date.now() - sw.startAt; sw.running = false; }
    else            { sw.startAt = Date.now(); sw.running = true; }
    buildControls();
  }
  function swReset() {
    sw.elapsed = 0; sw.running = false;
    swRender(); buildControls();
  }

  /* ---------------- 定时（倒计时）模式 ---------------- */
  const tm = { remain: 0, endAt: 0, running: false };

  function getTimerInputMs() {
    const m = Math.min(99, Math.max(0, parseInt($tMin.value) || 0));
    const s = Math.min(59, Math.max(0, parseInt($tSec.value) || 0));
    return (m * 60 + s) * 1000;
  }
  function tmRender() {
    const remain = tm.running ? Math.max(0, tm.endAt - Date.now()) : tm.remain;
    // 最后 10 秒用 ceil，保证显示 01~00 不会跳到 60
    const totalSec = remain <= 10000 ? Math.ceil(remain / 1000) : Math.floor(remain / 1000);
    $display.textContent = pad2(Math.floor(totalSec / 60)) + ':' + pad2(totalSec % 60);
    const danger = remain <= 10000 && remain > 0;
    if (danger !== $display.classList.contains('danger')) $display.classList.toggle('danger', danger);
  }
  function beep(times) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let i = 0;
    const tick = () => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'square';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      o.start(); o.stop(ctx.currentTime + 0.25);
      if (++i < times) setTimeout(tick, 400);
    };
    tick();
  }
  function tmStartPause() {
    if (tm.running) {
      tm.remain = Math.max(0, tm.endAt - Date.now());
      tm.running = false;
    } else {
      if (tm.remain === 0) tm.remain = getTimerInputMs();
      if (tm.remain === 0) return;
      tm.endAt = Date.now() + tm.remain;
      tm.running = true;
    }
    buildControls();
  }
  function tmReset() {
    tm.running = false; tm.remain = 0;
    $display.classList.remove('danger');
    showTimerInput();
    tmRenderFromInput();
    buildControls();
  }
  function tmRenderFromInput() {
    const m = Math.min(99, Math.max(0, parseInt($tMin.value) || 0));
    const s = Math.min(59, Math.max(0, parseInt($tSec.value) || 0));
    $display.textContent = pad2(m) + ':' + pad2(s);
  }
  function tmFinish() {
    tm.running = false; tm.remain = 0;
    beep(4);
    showTimerInput();
    tmRenderFromInput();
    buildControls();
  }
  function showTimerInput() {
    $timerInput.classList.remove('hidden');
    $display.classList.add('hidden');
    $sub.textContent = '设置倒计时时间';
  }
  function hideTimerInput() {
    $timerInput.classList.add('hidden');
    $display.classList.remove('hidden');
  }

  /* ---------------- 控制按钮 ---------------- */
  function buildControls() {
    $controls.innerHTML = '';
    const mk = (label, cls, fn) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.className = 'px-btn' + (cls ? ' ' + cls : '');
      b.addEventListener('click', fn);
      $controls.appendChild(b);
    };
    if (mode === 'stopwatch') {
      mk(sw.running ? '暂停' : '开始', 'primary', swStartPause);
      mk('复位', 'accent', swReset);
    } else if (mode === 'timer') {
      if (tm.running || tm.remain > 0) {
        mk(tm.running ? '暂停' : '继续', 'primary', tmStartPause);
        mk('复位', 'accent', tmReset);
      } else {
        mk('开始', 'primary', () => {
          tm.remain = getTimerInputMs();
          if (tm.remain === 0) return;
          hideTimerInput();
          tm.endAt = Date.now() + tm.remain;
          tm.running = true;
          buildControls();
        });
      }
    }
  }

  /* ---------------- 模式切换 ---------------- */
  function switchMode(m) {
    mode = m;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    $display.classList.remove('danger');
    if (m === 'clock') {
      hideTimerInput();
      $controls.innerHTML = '';
    } else if (m === 'stopwatch') {
      hideTimerInput();
      swRender(); buildControls();
    } else if (m === 'timer') {
      tmRenderFromInput();
      showTimerInput();
      buildControls();
    }
  }
  modeBtns.forEach(b => b.addEventListener('click', () => switchMode(b.dataset.mode)));
  [$tMin, $tSec].forEach(i => i.addEventListener('input', () => { if (!tm.running && tm.remain === 0) tmRenderFromInput(); }));

  /* ---------------- 双击全屏 ---------------- */
  document.addEventListener('dblclick', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });
  document.addEventListener('fullscreenchange', () => {
    document.body.classList.toggle('in-fullscreen', !!document.fullscreenElement);
    $fsTip.style.opacity = '0';
  });
  setTimeout(() => { $fsTip.style.opacity = '0'; }, 6000);

  /* ---------------- 主循环 ---------------- */
  function tick() {
    if (mode === 'clock') renderClock();
    else if (mode === 'stopwatch') swRender();
    else if (mode === 'timer') {
      if (tm.running) {
        if (tm.endAt - Date.now() <= 0) tmFinish();
        else tmRender();
      } else if (tm.remain > 0) {
        tmRender();
      }
    }
  }
  setInterval(tick, 100);
  renderClock();
})();
</script>
